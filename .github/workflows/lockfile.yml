name: Lockfile

# Fails when .github/workflows/actions.lock is out of sync with the workflows, or when a locked pin
# no longer verifies upstream, so a moved tag cannot slip a different commit into a run.
# Docs: https://gh.io/actions-lockfile
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lockfile:
    if: github.event_name != 'pull_request' || (github.base_ref != 'codex' && github.event.action != 'ready_for_review')
    name: Lockfile is in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the lockfile
        run: gh actions-lock --verify

  codex-check:
    name: Codex PR check
    if: github.event_name == 'pull_request' && github.base_ref == 'codex' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, codex-isolated]
    concurrency:
      group: codex-pr-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies and check
        run: |
          pnpm_version="$(node -p 'require("./package.json").packageManager')"
          npm exec --yes --package="$pnpm_version" -- pnpm install --frozen-lockfile
          npm exec --yes --package="$pnpm_version" -- pnpm check
